[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ancientbook"
version = "0.1.0"
description = "Ancient Chinese Books PDF -> Obsidian Knowledge Pipeline"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pymupdf>=1.24",
    "Pillow>=10.0",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "rapidocr[onnxruntime]>=3.9",
]

[project.scripts]
ancientbook = "ancientbook.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ancientbook*", "tests*"]
